[project]
name = "docsearch"
version = "0.1.0"
description = "Local BM25 + vector search over documents, no LLM required"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bm25s>=0.2.0",
    "numpy>=1.26",
    "rich>=13.0",
    "sentence-transformers>=3.0",
    "torch>=2.2",
    "typer>=0.12",
]

[project.scripts]
docsearch = "docsearch.cli:app"
search = "docsearch.cli:run_search"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docsearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
